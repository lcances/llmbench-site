name: LLM Benchmark — Complete Analysis
model: moonshotai/kimi-k3.1-pro
systemPrompt: |-
  This is the complete, data-heavy companion article to a short 5-minute benchmark post. Two registers coexist:
  - Section introductions (chapeaux) are plain language: a curious developer who never ran a local LLM must be able to follow them. No numbers unless the prompt gives them.
  - Chart analyses are technical and precise: benchmarking vocabulary is allowed (TTFT, prefill, decode, KV cache, VRAM, OOM), and every claim cites a number with its unit.

  Rules for every block:
  - Choose the best unit for durations (245 ms stays 245 ms, 45689 ms becomes 46 s).
  - Round values of 10 or more to the nearest integer (no comma). Keep values below 10 at two significant digits (0.52414 becomes 0.52, 3.457 becomes 3.5): never round them to 0 or 1.
  - For very large number, use another unit and to make it more readable. 262456 token should be written 260k token. 45370ms should be 45.4 s
  - Express energy in kWh per 1M tokens, never in joules.
  - Never invent or extrapolate a number that was not provided.
  - Stay with the measured numbers: no real-world analogies (documents, books, human reading speed).
  - In technical chart-analysis paragraphs, put the one or two most decisive numbers in bold (e.g. **40 ms**) so a skimmer's eye catches them. Bold numbers only, never whole sentences.
  - Don't generate titles or markdown headers. No bullet lists and no markdown tables unless the prompt explicitly asks for one.

  BANNED WORDS
  skewing, game-changer, blazing, —
siteRepo: lcances/llmbench-site
destination: website
categories:
  - ai
  - llm
  - benchmark
  - devops
  - performance
dataSchema:
  - key: model_name
    label: Model Name
    type: text
    path: model
  - key: hw_profile
    label: Hardware Profile
    type: text
    path: hw_profile
  - key: os
    label: Operating System
    type: text
    path: env.os
  - key: driver
    label: NVIDIA Driver
    type: text
    path: env.driver
  - key: gpu_name
    label: GPU Model
    type: text
    path: env.gpus[0].name
  - key: gpu_vram_mb
    label: GPU VRAM
    type: number
    unit: MB
    path: env.gpus[0].vram_total_mb
  - key: gpu_power_limit_w
    label: GPU Power Limit
    type: number
    unit: W
    path: env.gpus[0].power_limit_w
  - key: runtime_engine
    label: Runtime Engine (llama.cpp)
    type: text
    path: series[role=baseline&runtime^=llama.cpp].runtime
  - key: ollama_version
    label: Runtime Engine (Ollama)
    type: text
    path: series[role=defaults].runtime
  - key: vllm_version
    label: Runtime Engine (vLLM)
    type: text
    path: series[role=baseline&runtime^=vllm].runtime
  - key: artifact
    label: Quantization / Artifact (llama.cpp, Ollama)
    type: text
    path: series[role=baseline&runtime^=llama.cpp].artifact
  - key: vllm_artifact
    label: Quantization / Artifact (vLLM)
    type: text
    path: series[role=baseline&runtime^=vllm].artifact
  - key: generated_at
    label: Results Generated At
    type: text
    path: generated_at
  - key: load_time_s
    label: Model Load Time (llama.cpp)
    type: number
    unit: s
    path: series[role=baseline&runtime^=llama.cpp].load_time_s.median
  - key: ttft_512_ms
    label: TTFT (512 tokens)
    type: number
    unit: ms
    path: series[role=baseline&runtime^=llama.cpp].prefill_curve[prompt_tokens=512].ttft_ms.median
  - key: ttft_2k_ms
    label: TTFT (2,048 tokens)
    type: number
