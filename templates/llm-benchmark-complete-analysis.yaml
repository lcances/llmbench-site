    prompt: |-
      Write a short technical paragraph (3-4 sentences) analysing the throughput chart above, using the data below. Key numbers at 512-token prompts: total generation throughput climbs from {vllm_total_tps_c1} tok/s at 1 request to {vllm_total_tps_cmax} tok/s at {vllm_max_users} concurrent requests, while each stream slows from {vllm_req_decode_c1_tps} tok/s to {vllm_req_decode_cmax_tps} tok/s. Comment on how much of that gain survives at longer prompts (the other lines). One closing sentence on efficiency: wall draw goes from {vllm_wall_w_c1} W to {vllm_wall_w_cmax} W while throughput multiplies, so the energy cost of each token falls under load.
