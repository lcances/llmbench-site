  - id: energy-intro
    title: Energy & What It Costs
    type: generated
    prompt: |-
      Write a 2-3 sentence plain-language chapeau: every token generated costs electricity, and we measured it at the wall socket with a smart plug — the whole computer, not just the graphics card. The chart compares how many kilowatt-hours each runtime burns to generate a million tokens. No numbers yet.
  - id: energy-chart
    title: ""
    type: data-chart
    notes: |-
      One bar per runtime: xPath and seriesPath are both `runtime`, which keeps llama.cpp's and
      vLLM's "baseline" series apart. kwh_per_1m_gen is whole-box wall energy for all three
      (energy_basis: wall). GPU-only energy exists only as J/1k in the data, so it stays out of the
      chart and reaches the analysis block via converted schema fields instead.
    chart:
      arrayPath: series[role=baseline|defaults]
      chartType: bar
      xPath: runtime
      seriesPath: runtime
      yKeys:
        - translations.energy.kwh_per_1m_gen
      title: Energy per 1M generated tokens (at the wall)
      xLabel: runtime
      yLabel: kWh per 1M generated tokens
  - id: energy-analysis
    title: ""
    type: generated
    prompt: |-
      Write a short technical paragraph (3-4 sentences) analysing the energy chart above. Key numbers: stock llama.cpp burns {energy_kwh_per_1M} kWh per million generated tokens at the wall, versus {energy_kwh_per_1M_ollama} kWh for Ollama and {vllm_energy_kwh_per_1M} kWh for vLLM; average wall draw during an 8k-prompt llama.cpp run is {wall_w_mean} W. Split the llama.cpp figure: {energy_kwh_per_1M_gpu} kWh on the GPU, {energy_kwh_per_1M_cpu} kWh on the CPU package and {energy_kwh_per_1M_overhead} kWh for the rest of the box (power supply losses, RAM, fans, drives). Translate to money in one sentence: about {cost_eur_per_1m} € per million tokens at 0.25 €/kWh.
  - id: gpu-power-intro
    title: "How Hard the GPU Works"
    type: generated
    notes: |-
      Built from the GPU power draw every run records (power_w_mean, averaged over the run), set
      against the card's stock power limit. No model gets a power-cap sweep (`bench power-knee`),
      so this section never talks about lowering the limit.
    prompt: |-
      Write a 2-3 sentence plain-language chapeau: the graphics card has a stock power limit of {gpu_power_limit_w} W, and how close a runtime gets to it tells you how hard it makes the card work — which drives heat, fan noise and the power bill. The chart shows the card's average power draw as the prompt grows, for each runtime. No other numbers yet.
  - id: gpu-power-chart
    title: ""
    type: data-chart
    notes: |-
      One sub-path per runtime, named by seriesNames: vLLM's stock series is also called "baseline"
