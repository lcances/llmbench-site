  - id: method-bench
    title: "Appendix: Test Bench & Method"
    type: generated
    prompt: |-
      Write three short plain sentences: the hardware never changes across the whole series so results stay comparable between models; every runtime runs exactly as it installs, with no tuning; and power is measured at the wall socket with a smart plug — the whole box, not just the GPU.

      Then include a markdown table with exactly this information:
      - cpu: Intel Core Ultra 7 265K
      - motherboard: ASUS ROG MAXIMUS Z890 APEX Hovedkort - Intel Z890
      - ram: Kingston FURY Beast DDR5-5600 - 64GB (32 Gb)
      - gpu: MSI GeForce RTX 5060 Ti (16 Gb GDDR7)
      - system: {os}
      - nvidia driver: {driver}
      - llama.cpp version: {runtime_engine}
      - ollama version: {ollama_version}
      - vllm version: {vllm_version}
      - model artifact (llama.cpp, Ollama): {artifact}
      - model artifact (vLLM): {vllm_artifact}
  - id: contenders-intro
    title: "Appendix: The Contenders"
    type: generated
    prompt: |-
      Write a 2-3 sentence plain-language chapeau: the same model was run under several configurations — Ollama exactly as it installs, stock llama.cpp, llama.cpp with the exact flags Ollama passes, llama.cpp with a compressed q8_0 KV cache to stretch the context, and vLLM stock (plus its fp8 KV-cache variant). The table below lists every configuration and the flags each one changes; "stock" means the runtime's own defaults.
  - id: series-lineup
    title: ""
    type: data-table
    notes: |-
      Role                        │ Description
      ────────────────────────────┼──────────────────────────────────────────────────────────────
      baseline (llama.cpp)        │ llama-server's own defaults ({} — no flags forced).
      reference:ollama-defaults   │ llama.cpp running the exact CLI flags Ollama passes (-fa auto -b 512 -ub 512 -t 4).
      best:kv_type=q8_0           │ Context probe variant: uniform q8_0 KV cache + flash attention.
      defaults                    │ The actual Ollama runtime instance with stock configuration.
      baseline (vllm)             │ vLLM serve stock defaults.
      best:kv_cache_dtype=fp8     │ vLLM context probe variant: fp8 KV cache.

      No tuning search since 2026-10-27: tuned:* and best:flash_attn=* roles no longer exist.
    table:
      arrayPath: series
      columns:
        - label: Role
          path: role
        - label: Runtime
          path: runtime
          code: true
        - label: Flags
          empty: stock
          code: true
          flags:
            - flag: -fa
              path: config.flash_attn
            - flag: -ctk
              path: config.kv_type_k
            - flag: -ctv
              path: config.kv_type_v
            - flag: --kv-cache-dtype
              path: config.kv_cache_dtype
            - flag: -b
              path: config.batch_size
            - flag: -ub
              path: config.ubatch_size
            - flag: -t
              path: config.threads
  - id: further-reading
    title: Further Reading
    type: generated
    prompt: |-
      - Add a placeholder link to the short 5-minute article about this model.
      - Add a placeholder link to the previous article of the series.
      - Add a placeholder link to the next article of the series.
