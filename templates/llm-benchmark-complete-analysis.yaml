    type: number
    unit: MB
    path: series[role=best:kv_type=q8_0].full_points[max:ctx].peak_vram_mb
  - key: decode_max_context_q8_tps
    label: Generation Speed at Max Context (q8_0 KV cache)
    type: number
    unit: tok/s
    path: series[role=best:kv_type=q8_0].full_points[max:ctx].decode_tps.median
  - key: ttft_max_context_q8_ms
    label: TTFT at Max Context (q8_0 KV cache)
    type: number
    unit: ms
    path: series[role=best:kv_type=q8_0].full_points[max:ctx].ttft_ms.median
  - key: load_time_ollama_s
    label: Model Load Time (Ollama)
    type: number
    unit: s
    path: series[role=defaults].load_time_s.median
  - key: ttft_512_ollama_ms
    label: TTFT (512 tokens, Ollama)
    type: number
    unit: ms
    path: series[role=defaults].prefill_curve[prompt_tokens=512].ttft_ms.median
  - key: ttft_32k_ollama_ms
    label: TTFT (32,768 tokens, Ollama)
    type: number
    unit: ms
    path: series[role=defaults].prefill_curve[prompt_tokens=32768].ttft_ms.median
  - key: prefill_512_ollama_tps
    label: Prefill Speed (512t, Ollama)
    type: number
