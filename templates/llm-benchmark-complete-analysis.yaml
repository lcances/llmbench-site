    type: number
    unit: W
    path: series[role=baseline&runtime^=vllm].batched_curve[prompt_tokens=512&concurrency=1].wall_w_mean
  - key: vllm_wall_w_cmax
    label: Wall Power Draw (most requests, vLLM)
    type: number
    unit: W
    path: series[role=baseline&runtime^=vllm].batched_curve[max:concurrency].wall_w_mean
  - key: verdict
    label: Verdict
    type: select
    options:
      - Great for Production
      - Good for Internal Tools
      - Niche / Heavy Requirements
      - Not Recommended
      - Custom...
blocks:
  - id: intro
    title: ""
    type: generated
    prompt: |-
      Write the article lead. Open with a 2-sentence hook built on the two most striking of these measured numbers for {model_name} on a {gpu_name}, stock llama.cpp:
      - writes {decode_512_tps} tokens per second on a short prompt
      - first token {ttft_512_ms} ms after a short prompt
      - holds a {max_context}-token context in {peak_vram_max_ctx_mb} MB of the card's {gpu_vram_mb} MB
      - {energy_kwh_per_1M} kWh at the wall per 1M generated tokens

      Then 2-3 plain sentences: we ran {model_name} with three runtimes — llama.cpp, Ollama and vLLM — each exactly as it installs, with no tuning, and measured generation speed, prompt processing, the wait for the first token, the context ceiling, memory, power at the wall socket and serving many users at once. Mention that this is the full-data companion to a shorter 5-minute article, and that the exact test bench is described at the end.

      For reference on expected capacity (use it to set expectations for {model_name}, one short sentence):
      - very small models (<2B) are useful for tasks that require speed (routing, safe guard, monitoring, reranking)
      - small models (<8B) can be interesting to run on mobile or on edge
      - dense medium size models (10B <> 27B) start to be interesting for analysing and general knowledge
      - dense medium MoE (35B a3b) are interesting for VRAM constrained systems and more specialized work
    notes: |-
      Inverted pyramid: the article leads with measured numbers (no PDF / human-reading analogies),
      then TL;DR + verdict, then the deep dives; methodology lives in the appendix at the bottom.
      Since 2026-10-27 every runtime runs stock (no tuning search): llama.cpp's headline series is
      its `baseline` (llama-server defaults).
  - id: headline
    title: Straight to the Results
    type: generated
    prompt: |-
      Write one short sentence introducing the table: every number below was measured on stock llama.cpp, and each row gets its own deep dive further down. Then include the following exact Markdown metric table:

      | Metric | 512 Context | 8k Context | 32k Context | Max Context ({max_context}) |
      | --- | --- | --- | --- | --- |
      | Prompt Processing (tok/s) | {prefill_512_tps} | {prefill_8k_tps} | {prefill_32k_tps} | {prefill_max_context_tps} |
      | TTFT | {ttft_512_ms} ms | {ttft_8k_ms} ms | {ttft_32k_ms} ms | {ttft_max_context_ms} ms |
      | Generation (tok/s) | {decode_512_tps} | {decode_8k_tps} | {decode_32k_tps} | {decode_max_context_tps} |

      Close with one short line on energy: {energy_kwh_per_1M} kWh per 1M generated tokens at the wall, about {cost_eur_per_1m} € at 0.25 €/kWh.
  - id: verdict-block
    title: The Verdict
    type: generated
    prompt: |-
      Open with one plain sentence stating the verdict for {model_name} on a budget computer with a {gpu_name}: {verdict}. Then give exactly 4 bullet points, one finding each, with the key number of each bullet in bold:
      - speed: first token in {ttft_512_ms} ms at best, generation from {decode_512_tps} tok/s down to {decode_max_context_tps} tok/s at the {max_context}-token ceiling
      - runtimes: on a short prompt, Ollama generates {decode_512_ollama_tps} tok/s with a {ttft_512_ollama_ms} ms TTFT, against {decode_512_tps} tok/s and {ttft_512_ms} ms for llama.cpp; vLLM answers first in {vllm_ttft_512_ms} ms and serves {vllm_max_users} requests at once at {vllm_total_tps_cmax} tok/s in total
      - memory: the full {max_context}-token context peaks at {peak_vram_max_ctx_mb} MB with the default f16 KV cache, {peak_vram_max_ctx_q8_mb} MB with a q8_0 KV cache
      - energy: {energy_kwh_per_1M} kWh per 1M generated tokens at the wall with llama.cpp, {energy_kwh_per_1M_ollama} with Ollama, {vllm_energy_kwh_per_1M} with vLLM
  - id: decode-ladder-intro
    title: "The Main Event: Generation Speed"
    type: generated
    prompt: Write a 2-3 sentence plain-language chapeau for a section about how fast {model_name} writes its answers, and how that speed changes as the prompt gets longer. Explain that the chart compares Ollama out of the box against llama.cpp — stock, and with the exact flags Ollama passes — all running the exact same model file (full configuration details are in the appendix at the end). No numbers yet.
  - id: decode-ladder-chart
    title: ""
    type: data-chart
    prompt: ""
    notes: |-
      seriesLabels keys must match the series' comma-joined role list exactly. Keep labels short
      (16 characters or fewer) so the legend does not truncate them. vLLM stays off the shared
      line charts: its stock series is also called "baseline" and would merge with llama.cpp's.
    chart:
      arrayPath: series[role=defaults|reference:ollama-defaults|baseline&runtime^=llama.cpp|ollama].prefill_curve
      chartType: line
      xPath: prompt_tokens
      yKeys:
        - decode_tps.median
      title: Decode speed vs context size
      xLabel: prompt tokens in context
      yLabel: decode tok/s (median)
      seriesLabels:
        defaults: Ollama (stock)
        reference:ollama-defaults: llama.cpp/Ollama
        baseline: llama.cpp stock
      roundXToPowerOf2: true
  - id: decode-ladder-analysis
    title: ""
    type: generated
    prompt: "Write a short technical paragraph (3-4 sentences) analysing the decode speed chart above, using the data table below. Key numbers: stock llama.cpp decodes at {decode_512_tps} tok/s at 512-token context versus {decode_512_ollama_tps} tok/s for stock Ollama; {decode_8k_tps} tok/s at 8k; {decode_32k_tps} tok/s at 32k versus {decode_32k_ollama_tps} tok/s for Ollama. Comment on the size of the gap between the runtimes and on how much speed is lost as context deepens. Add one short sentence on whether llama.cpp with Ollama's own flags ({decode_512_ref_tps} tok/s at 512) lands on stock llama.cpp or on Ollama — that tells us whether the difference comes from the flags or from Ollama itself."
    dataPaths:
      - series[role=defaults|reference:ollama-defaults|baseline&runtime^=llama.cpp|ollama].prefill_curve
  - id: prefill-intro
    title: "The Prefill Phase: Reading Speed"
    type: generated
    prompt: "Write a 2-3 sentence plain-language chapeau: before a model writes anything it must first read the prompt (this is called prefill), and this reading speed decides how usable the model is on long inputs. The chart compares the same configurations as above. No numbers yet."
  - id: prefill-chart
    title: ""
    type: data-chart
    prompt: ""
    chart:
      arrayPath: series[role=defaults|reference:ollama-defaults|baseline&runtime^=llama.cpp|ollama].prefill_curve
      chartType: line
      xPath: prompt_tokens
      yKeys:
        - prefill_tps.median
      title: Prompt processing speed vs context size
      xLabel: prompt tokens in context
      yLabel: prefill tok/s (median)
      seriesLabels:
        defaults: Ollama (stock)
        reference:ollama-defaults: llama.cpp/Ollama
        baseline: llama.cpp stock
      roundXToPowerOf2: true
  - id: prefill-analysis
    title: ""
    type: generated
    prompt: "Write a short technical paragraph (2-3 sentences) analysing the prefill chart above, using the data table below. Key numbers for stock llama.cpp: {prefill_512_tps} tok/s at 512 tokens, {prefill_8k_tps} tok/s at 8k, {prefill_32k_tps} tok/s at 32k, {prefill_max_context_tps} tok/s at the {max_context}-token maximum; Ollama reaches {prefill_512_ollama_tps} tok/s at 512 tokens. Comment on where each runtime peaks and how fast prefill degrades at depth."
    dataPaths:
      - series[role=defaults|reference:ollama-defaults|baseline&runtime^=llama.cpp|ollama].prefill_curve
  - id: ttft-intro
    title: "The Wait: Time to First Token"
    type: generated
