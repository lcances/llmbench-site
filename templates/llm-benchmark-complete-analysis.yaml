    prompt: |-
      Write a 2-3 sentence plain-language chapeau: everything so far measured one request at a time, but a model serving a team or an application receives many requests at once — and that is the job of vLLM, the server runtime used in production deployments, which interleaves many requests through the GPU instead of queueing them (a technique called continuous batching). Add one plain caveat: vLLM runs a different compressed model file ({vllm_artifact}) than the one llama.cpp and Ollama used ({artifact}), so this compares two complete setups, not just two programs. No numbers yet.
