    type: number
    unit: tok/s
    path: series[role=baseline&runtime^=vllm].batched_curve[prompt_tokens=512&concurrency=1].req_decode_tps.median
  - key: vllm_req_decode_cmax_tps
    label: Per-Request Generation (most requests, vLLM)
    type: number
    unit: tok/s
    path: series[role=baseline&runtime^=vllm].batched_curve[max:concurrency].req_decode_tps.median
  - key: vllm_wall_w_c1
