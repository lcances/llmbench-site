name: render-check

# Merging is the publish action, so a render error found after merge is a broken
# main. This runs the same render on every PR, deploys nothing, and leaves the
# built site as a downloadable artifact for review.
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18       # same pin as publish.yml
      - run: quarto render
      - name: Check the dev.to transform on the changed posts
        env:
          DEVTO_DRY_RUN: "1"
          SITE_URL: https://lcances.github.io/llmbench-site/
        run: python3 .github/scripts/devto_sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
