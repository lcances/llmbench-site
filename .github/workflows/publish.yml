name: publish

# A push to main that touches posts/ IS the publish action: the writing app
# pushes there after its own review. Each changed post becomes, or updates, a
# dev.to draft; making it public is done by hand on dev.to.
on:
  push:
    branches: [main]
    paths: ["posts/**"]
  # Manual trigger: syncs every post, e.g. after the API key is added.
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false   # never interrupt a sync mid-flight

permissions:
  contents: read

jobs:
  devto:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commits the article-ID mapping back
    steps:
      - uses: actions/checkout@v4
        with:
          # On main itself, so the mapping commit below can be pushed; full
          # history, so the push's diff can tell which posts it changed.
          ref: main
          fetch-depth: 0
      - name: Sync changed posts to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_DRY_RUN: ${{ vars.DEVTO_DRY_RUN }}
          # Empty on a manual run, which syncs every post.
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/devto_sync.py
      - name: Commit the article-ID mapping
        run: |
          if git diff --quiet -- .devto/articles.json; then
            echo "mapping unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .devto/articles.json
          git commit -m "devto: record article IDs [skip ci]"
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot loop. Retry in case the app pushed while we synced.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
